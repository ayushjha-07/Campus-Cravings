services:
  - type: static
    name: campus-cravings
    repo: https://github.com/ayushjha-07/Campus-Cravings.git
    branch: main
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
